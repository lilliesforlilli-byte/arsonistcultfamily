<!DOCTYPE html>
<html>
<head>
  <title>Dad 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a40, #3a0ca3);
      color: white;
      overflow: hidden;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
    }

    .text {
      font-size: 24px;
      max-width: 80%;
      opacity: 0;
      transition: opacity 1.5s ease;
      white-space: pre-line;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .visible {
      opacity: 1;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background: linear-gradient(45deg, #ffbe0b, #fb5607);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,190,11,0.8);
      margin-top: 30px;
      display: none;
      color: white;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* Floating confetti */
    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      opacity: 0.7;
      border-radius: 50%;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(-10vh);
      }
    }
  </style>
</head>

<body>

<div id="text" class="text"></div>
<button id="celebrateBtn">Continue to Celebration 🎉</button>

<script>
  const messages = [
    "Some people don’t just exist… they brighten everything they touch.",
    "You stand strong for us… even when no one sees what you carry.",
    "Strong. Brave. Resilient in ways words can’t fully capture.",
    "And somehow… through everything… you’re still a ray of sunshine.",
    "Happy Birthday, Dad 🎉\nYou deserve every bit of light you give to others."
  ];

  let index = 0;
  const textDiv = document.getElementById("text");
  const celebrateBtn = document.getElementById("celebrateBtn");

  // create confetti
  for (let i = 0; i < 30; i++) {
    let dot = document.createElement("div");
    dot.classList.add("confetti");
    dot.style.left = Math.random() * 100 + "vw";
    dot.style.animationDuration = (5 + Math.random() * 5) + "s";
    dot.style.opacity = Math.random();
    document.body.appendChild(dot);
  }

  window.onload = () => {
    showText();
  };

  function showText() {
    textDiv.classList.remove("visible");

    setTimeout(() => {
      textDiv.innerText = messages[index];
      textDiv.classList.add("visible");

      index++;

      if (index < messages.length) {
        setTimeout(showText, 3500);
      } else {
        setTimeout(() => {
          celebrateBtn.style.display = "block";
        }, 1500);
      }

    }, 300);
  }

  celebrateBtn.addEventListener("click", () => {
    window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
  });
</script>

</body>
</html>
