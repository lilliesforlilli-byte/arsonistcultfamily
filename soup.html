<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #020024, #000);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .btn {
      padding: 12px 25px;
      margin: 10px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 140px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    /* DIALOGUE */
    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      text-align: left;
    }

    #choices button {
      margin-top: 10px;
      display: block;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 50px;
    }

    .bullet {
      position: absolute;
    }

  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>
<button class="btn" onclick="startMission()">Start</button>

<div id="companions" class="companions hidden">
  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg"><p>Snow ❄️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg"><p>Gaia ☠️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg"><p>Skyfire ⚡</p>
  </div>
</div>

<!-- DIALOGUE -->
<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<!-- GAME -->
<div id="game">
  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<audio id="bgm" loop src="song1.m4a"></audio>
<audio id="shoot" src="song2.m4a"></audio>

<script>
let companion = "snow";

// TYPEWRITER
function typeText(text, callback) {
  let i = 0;
  let el = document.getElementById("dialogueText");
  el.innerHTML = "";

  let interval = setInterval(() => {
    el.innerHTML += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if (callback) callback();
    }
  }, 25);
}

// SHOW DIALOGUE
function showDialogue(text, choices=[]) {
  document.getElementById("dialogueBox").classList.remove("hidden");
  let choiceDiv = document.getElementById("choices");
  choiceDiv.innerHTML = "";

  typeText(text, () => {
    choices.forEach(c => {
      let btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = c.text;
      btn.onclick = c.action;
      choiceDiv.appendChild(btn);
    });
  });
}

// FLOW
function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion(c) {
  companion = c;

  showDialogue(
    getLine("intro"),
    [
      { text: "I'm ready.", action: intro2 },
      { text: "Stay with me.", action: introAlt }
    ]
  );
}

function intro2() {
  showDialogue(getLine("ready"), [
    { text: "Start battle", action: startGame }
  ]);
}

function introAlt() {
  showDialogue(getLine("soft"), [
    { text: "Start battle", action: startGame }
  ]);
}

// COMPANION LINES
function getLine(type) {
  if (companion === "snow") {
    if (type === "intro") return "…You chose me.";
    if (type === "ready") return "Then don’t hesitate.";
    if (type === "soft") return "I’m not going anywhere.";
  }

  if (companion === "gaia") {
    if (type === "intro") return "Ohhh this is gonna be fun 😈";
    if (type === "ready") return "Let’s wreck them.";
    if (type === "soft") return "Relax, I’ve got your back.";
  }

  if (companion === "skyfire") {
    if (type === "intro") return "Connection established.";
    if (type === "ready") return "Engaging combat mode.";
    if (type === "soft") return "I will remain online.";
  }
}

// GAME START
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("bgm").play();
}

// SHOOT
document.addEventListener("click", e => {
  if (!document.getElementById("game").style.display) return;

  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";
  b.style.left = e.clientX + "px";
  b.style.top = (window.innerHeight - 60) + "px";

  document.body.appendChild(b);

  let s = document.getElementById("shoot");
  s.currentTime = 0;
  s.play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 8) + "px";

    if (b.offsetTop < 100) {
      b.remove();
      clearInterval(i);
    }
  }, 16);
});
</script>

</body>
</html>
