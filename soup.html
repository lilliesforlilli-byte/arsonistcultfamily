<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      cursor: crosshair;
    }

    h2 { text-align: center; margin-top: 30px; }

    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
      margin: 10px;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 140px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    #game {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      color: #00c3ff;
    }

    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill { height: 100%; }

    #playerBar { background: #00ff88; width: 100%; }
    #enemyBar { background: red; width: 100%; }

    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.8);
      padding: 20px;
    }

    #finalScene {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: black;
    }

  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<div style="text-align:center">
  <button class="btn" onclick="startMission()">Start</button>
</div>

<div id="companions" class="companions hidden">
  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg"><p>Snow Mirage ❄️</p>
  </div>
</div>

<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar"></div></div>
    <div class="bar"><div id="enemyBar"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<div id="finalScene">
  <div>
    <p id="finalText"></p>
    <button onclick="location.reload()">Restart</button>
  </div>
</div>

<audio id="bgm" src="song1.m4a" loop></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let playerHP = 100;
let enemyHP = 100;
let gameActive = false;

/* FLOW */
function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion() {
  showDialogue("…Snow Mirage online.\nYou chose me.", [
    { text: "start mission", action: startGame }
  ]);
}

function showDialogue(text, choices=[]) {
  document.getElementById("dialogueBox").classList.remove("hidden");

  let t = document.getElementById("dialogueText");
  let c = document.getElementById("choices");

  t.innerText = text;
  c.innerHTML = "";

  choices.forEach(opt => {
    let b = document.createElement("button");
    b.innerText = opt.text;
    b.onclick = opt.action;
    c.appendChild(b);
  });
}

/* GAME */
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("dialogueBox").classList.add("hidden");

  document.getElementById("bgm").play();
  gameActive = true;
}

/* SHOOT FIXED */
document.addEventListener("click", e => {
  if (!gameActive) return;

  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";
  b.style.left = e.clientX + "px";
  b.style.top = (window.innerHeight - 60) + "px";

  document.body.appendChild(b);
  document.getElementById("shootSound").play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 10) + "px";

    if (b.offsetTop < 120) {
      enemyHP -= 10;
      updateHP();
      b.remove();
      clearInterval(i);
    }
  }, 16);
});

/* ENEMY */
setInterval(() => {
  if (!gameActive) return;

  playerHP -= 2;
  updateHP();
}, 1000);

/* HP */
function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (enemyHP <= 0) {
    gameActive = false;
    showFinal();
  }
}

/* FINAL */
function showFinal() {
  document.getElementById("game").style.display = "none";
  document.getElementById("finalScene").style.display = "flex";

  document.getElementById("finalText").innerText =
`…hey.

You’re brave.
Strong.
Resilient.
Kind.

And you never stop trying to be better.

That’s what I admire about you.

Happy Birthday.

…you matter more than you think.`;
}
</script>

</body>
</html>
