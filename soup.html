<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .btn {
      padding: 12px 20px;
      margin: 10px;
      border-radius: 20px;
      border: none;
      background: cyan;
      cursor: pointer;
    }

    .hidden { display: none; }

    .arena {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle, #0a0f2c, black);
    }

    #player {
      position: absolute;
      bottom: 20px;
      left: 45%;
      font-size: 40px;
    }

    .bullet {
      position: absolute;
      font-size: 20px;
    }

    #enemy {
      position: absolute;
      top: 50px;
      left: 40%;
      font-size: 50px;
    }

    .hp-bar {
      width: 80%;
      height: 10px;
      background: #333;
      margin: 5px auto;
      border-radius: 10px;
    }

    .hp {
      height: 100%;
      background: lime;
      width: 100%;
    }

    .enemy-hp { background: red; }

  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<button class="btn" onclick="startGame()">Start Game</button>

<!-- MUSIC -->
<audio id="bgm" loop src="song1.m4a"></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<!-- GAME -->
<div id="game" class="arena hidden">

  <p>Player HP</p>
  <div class="hp-bar"><div id="playerHP" class="hp"></div></div>

  <p>Enemy HP</p>
  <div class="hp-bar"><div id="enemyHP" class="hp enemy-hp"></div></div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>

</div>

<script>
let player = document.getElementById("player");
let enemy = document.getElementById("enemy");

let playerHP = 100;
let enemyHP = 100;

let playerX = 45;
let enemyX = 40;

function startGame() {
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("bgm").play();
  gameLoop();
}

// MOVEMENT (KEYBOARD)
document.addEventListener("keydown", (e) => {
  if (e.key === "a") playerX -= 3;
  if (e.key === "d") playerX += 3;
  if (e.key === " ") shoot();

  player.style.left = playerX + "%";
});

// SHOOT
function shoot() {
  const bullet = document.createElement("div");
  bullet.classList.add("bullet");
  bullet.innerHTML = "⚡";
  bullet.style.left = playerX + "%";
  bullet.style.bottom = "60px";

  document.getElementById("game").appendChild(bullet);

  document.getElementById("shootSound").currentTime = 0;
  document.getElementById("shootSound").play();

  let pos = 60;

  const interval = setInterval(() => {
    pos += 5;
    bullet.style.bottom = pos + "px";

    // HIT DETECTION
    if (pos > 400 && Math.abs(playerX - enemyX) < 10) {
      enemyHP -= 10;
      updateHP();
      bullet.remove();
      clearInterval(interval);
    }

    if (pos > window.innerHeight) {
      bullet.remove();
      clearInterval(interval);
    }

  }, 30);
}

// ENEMY MOVEMENT + ATTACK
function gameLoop() {

  setInterval(() => {
    enemyX += (Math.random() * 10 - 5);
    enemy.style.left = enemyX + "%";

    // enemy attack
    playerHP -= Math.floor(Math.random() * 5);
    updateHP();

    checkGame();
  }, 1000);
}

// UPDATE HP
function updateHP() {
  document.getElementById("playerHP").style.width = playerHP + "%";
  document.getElementById("enemyHP").style.width = enemyHP + "%";
}

// END GAME
function checkGame() {
  if (enemyHP <= 0) {
    alert("🎉 YOU WIN!");
    location.reload();
  }

  if (playerHP <= 0) {
    alert("💀 YOU LOST!");
    location.reload();
  }
}
</script>

</body>
</html>
