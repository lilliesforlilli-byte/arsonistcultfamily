<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      cursor: crosshair;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
      margin: 10px;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 160px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.3s;
    }

    .comp-btn:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.1);
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      color: #00c3ff;
      font-size: 18px;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill {
      height: 100%;
      border-radius: 10px;
    }

    #playerBar { background: #00ff88; width: 100%; }
    #enemyBar { background: red; width: 100%; }

    /* DIALOGUE */
    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
    }

    #choices button {
      display: block;
      margin-top: 10px;
    }

    /* FINAL */
    #finalScene {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: black;
    }

    .finalBox {
      max-width: 600px;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
    }

    #finalText {
      line-height: 1.8;
    }
  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<div style="text-align:center">
  <button class="btn" onclick="startMission()">Start Mission</button>
</div>

<!-- COMPANIONS -->
<div id="companions" class="companions hidden">

  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg">
    <p>Snow Mirage ❄️</p>
  </div>

  <div class="comp-btn" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg">
    <p>Skyfire 🔥</p>
  </div>

  <div class="comp-btn" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg">
    <p>Gaia 🌿</p>
  </div>

</div>

<!-- DIALOGUE -->
<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar" class="fill"></div></div>
    <div class="bar"><div id="enemyBar" class="fill"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<!-- FINAL -->
<div id="finalScene">
  <div class="finalBox">
    <p id="finalText"></p>
    <button class="btn hidden" id="restartBtn" onclick="location.reload()">Restart</button>
  </div>
</div>

<audio id="bgm" src="song1.m4a" loop></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let playerHP = 100;
let enemyHP = 100;
let gameActive = false;
let typingTimeout;

/* TYPEWRITER FIXED */
function typeText(text, element, callback) {
  let i = 0;
  element.innerHTML = "";
  clearTimeout(typingTimeout);

  function type() {
    if (i < text.length) {
      let char = text[i];

      if (char === "\n") {
        element.innerHTML += "<br>";
      } else {
        element.innerHTML += char;
      }

      let delay = (char === "." || char === "…") ? 200 : 18;
      i++;
      typingTimeout = setTimeout(type, delay);
    } else if (callback) {
      callback();
    }
  }

  type();
}

/* DIALOGUE */
function showDialogue(text, choices=[]) {
  const box = document.getElementById("dialogueBox");
  const textEl = document.getElementById("dialogueText");
  const choiceDiv = document.getElementById("choices");

  box.classList.remove("hidden");
  choiceDiv.innerHTML = "";

  typeText(text, textEl, () => {
    choices.forEach(opt => {
      let btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = opt.text;
      btn.onclick = opt.action;
      choiceDiv.appendChild(btn);
    });
  });
}

/* FLOW */
function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

/* COMPANIONS */
function chooseCompanion(name) {
  let text = "";

  if (name === "snow") {
    text = "…Snow Mirage online.\n\nSilent. Cold. Watching.\n\nYou chose me.";
  } 
  else if (name === "skyfire") {
    text = "…Skyfire ignited.\n\nWe burn through anything in our way.\n\nLet’s move.";
  } 
  else if (name === "gaia") {
    text = "…Gaia awakened.\n\nThe earth stands with you.\n\nYou are not alone.";
  }

  showDialogue(text, [
    { text: "Start Mission", action: startGame }
  ]);
}

/* GAME START */
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("dialogueBox").classList.add("hidden");
  document.getElementById("bgm").play();

  gameActive = true;
}

/* SHOOT */
document.addEventListener("click", e => {
  if (!gameActive) return;

  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";
  b.style.left = e.clientX + "px";
  b.style.top = (window.innerHeight - 60) + "px";

  document.body.appendChild(b);

  let sound = document.getElementById("shootSound");
  sound.currentTime = 0;
  sound.play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 10) + "px";

    if (b.offsetTop < 120) {
      enemyHP -= 10;
      updateHP();
      b.remove();
      clearInterval(i);
    }

    if (b.offsetTop < 0) {
      b.remove();
      clearInterval(i);
    }
  }, 16);
});

/* ENEMY DAMAGE */
setInterval(() => {
  if (!gameActive) return;

  playerHP -= 2;
  updateHP();
}, 1000);

/* HP */
function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (enemyHP <= 0) {
    gameActive = false;
    setTimeout(showFinal, 800);
  }
}

/* FINAL */
function showFinal() {
  document.getElementById("game").style.display = "none";
  document.getElementById("finalScene").style.display = "flex";

  let msg = `…hey.

I’ve been watching you.

The way you kept going…
even when it got hard.

You’re brave.

Strong.

Resilient.

Kind.

And unwaveringly determined.

You keep trying to change for the better…

And that’s what I admire about you.

I’m really glad you stayed.

Happy Birthday.

…you matter more than you think.`;

  typeText(msg, document.getElementById("finalText"), () => {
    document.getElementById("restartBtn").classList.remove("hidden");
  });
}
</script>

</body>
</html>
