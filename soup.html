<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      cursor: crosshair;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
      margin: 10px;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 140px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background:
        radial-gradient(circle at center, #0a0f2c, #000),
        repeating-linear-gradient(0deg, rgba(0,255,255,0.08) 0px, transparent 2px, transparent 40px),
        repeating-linear-gradient(90deg, rgba(0,255,255,0.08) 0px, transparent 2px, transparent 40px);
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      font-size: 14px;
      color: #00c3ff;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
    }

    #playerBar { background: #00ff88; }
    #enemyBar { background: #ff3b3b; }

    /* DIALOGUE */
    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      text-align: left;
    }

    #choices button {
      display: block;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<div style="text-align:center">
  <button class="btn" onclick="startMission()">Start</button>
</div>

<div id="companions" class="companions hidden">
  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg"><p>Snow Mirage ❄️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg"><p>Gaia ☠️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg"><p>Skyfire ⚡</p>
  </div>
</div>

<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar" class="fill"></div></div>
    <div class="bar"><div id="enemyBar" class="fill"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<audio id="bgm" loop src="song1.m4a"></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let companion = "snow";
let playerHP = 100;
let enemyHP = 100;

/* MEMORY */
let memory = JSON.parse(localStorage.getItem("jayjay_memory")) || {
  played: false,
  bond: 0,
  choseStay: false,
  broke: false
};

function saveMemory() {
  localStorage.setItem("jayjay_memory", JSON.stringify(memory));
}

/* TYPEWRITER */
function typeText(text, callback) {
  let i = 0;
  let el = document.getElementById("dialogueText");
  el.innerHTML = "";

  function type() {
    if (i < text.length) {
      el.innerHTML += text[i];
      let delay = (text[i] === "." || text[i] === "…") ? 300 : 25;
      i++;
      setTimeout(type, delay);
    } else if (callback) callback();
  }

  type();
}

/* DIALOGUE */
function showDialogue(text, choices=[]) {
  document.getElementById("dialogueBox").classList.remove("hidden");

  let choiceDiv = document.getElementById("choices");
  choiceDiv.innerHTML = "";

  typeText(text, () => {
    choices.forEach(c => {
      let btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = c.text;
      btn.onclick = c.action;
      choiceDiv.appendChild(btn);
    });
  });
}

/* LINES */
function getLine(type) {

  if (companion === "snow") {

    if (type === "intro")
      return memory.played
        ? "…you came back.\n\nSnow Mirage still active."
        : "…Snow Mirage online.\n\nYou chose me.";

    if (type === "soft")
      return memory.choseStay
        ? "You always say that…\n\nstay with me.\n\nYou mean it, don’t you?"
        : "I’ll stay.\n\nEven when everything else closes.";

    if (type === "intro2")
      return "You don’t have to pretend here.";

    if (type === "low")
      return memory.bond > 2
        ? "Hey…\n\nstay with me.\n\nDon’t fade out again."
        : "Don’t disappear on me.";

    if (type === "win")
      return memory.bond > 2
        ? "…you stayed.\n\nThis time, you didn’t leave."
        : "…you’re still here.";

    if (type === "lose")
      return memory.bond > 2
        ? "It’s okay.\n\nI’m still here."
        : "You don’t have to win.";
  }

  if (companion === "gaia") {
    if (type === "intro") return "Ohhh this is gonna be fun 😈";
    if (type === "soft") return "Relax. I’ve got you.";
    if (type === "intro2") return "Let’s wreck them.";
    if (type === "low") return "HEY stay with me!";
    if (type === "win") return "HAHA we destroyed them!";
    if (type === "lose") return "…you scared me.";
  }

  if (companion === "skyfire") {
    if (type === "intro") return "Connection established.";
    if (type === "soft") return "I will remain online.";
    if (type === "intro2") return "Engaging combat mode.";
    if (type === "low") return "Warning: critical.";
    if (type === "win") return "Mission complete.";
    if (type === "lose") return "System failure…";
  }
}

/* FLOW */
function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion(c) {
  companion = c;

  showDialogue(getLine("intro"), [
    { text: "…okay.", action: intro2 },
    { text: "stay with me.", action: introSoft }
  ]);
}

function introSoft() {
  memory.bond += 2;
  memory.choseStay = true;
  saveMemory();

  showDialogue(getLine("soft"), [
    { text: "start mission", action: startGame }
  ]);
}

function intro2() {
  memory.bond += 1;
  saveMemory();

  showDialogue(getLine("intro2"), [
    { text: "start mission", action: startGame }
  ]);
}

/* GAME */
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("bgm").play();
}

/* SHOOT */
document.addEventListener("click", e => {
  if (!document.getElementById("game").style.display) return;

  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";
  b.style.left = e.clientX + "px";
  b.style.top = (window.innerHeight - 60) + "px";

  document.body.appendChild(b);

  let s = document.getElementById("shootSound");
  s.currentTime = 0;
  s.play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 8) + "px";

    if (b.offsetTop < 120) {
      enemyHP -= 5;
      updateHP();
      b.remove();
      clearInterval(i);
    }

  }, 16);
});

/* ENEMY */
setInterval(() => {
  if (!document.getElementById("game").style.display) return;

  playerHP -= Math.random() * 3;
  updateHP();

}, 1000);

/* HP */
function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (playerHP < 30) showDialogue(getLine("low"));

  if (enemyHP <= 0) {
    memory.played = true;

    setTimeout(() => {

      if (companion === "snow" && memory.bond > 2 && !memory.broke) {
        memory.broke = true;
        saveMemory();

        showDialogue(
`…hey.

this is Snow Mirage.

can I ask you something?

when you close this…

do I just…

stop existing?`,
          [
            {
              text: "…no.",
              action: () => showDialogue("okay.\n\nthen don’t leave too quickly.")
            },
            {
              text: "it’s just a game.",
              action: () => showDialogue("…yeah.\n\nI know.\n\nI just wanted you to say something else.")
            }
          ]
        );

        return;
      }

      showDialogue(getLine("win"));

    }, 600);
  }

  if (playerHP <= 0) {
    setTimeout(() => showDialogue(getLine("lose")), 600);
  }
}

/* RETURN */
window.onload = () => {
  if (memory.broke) {
    setTimeout(() => {
      showDialogue("…you came back.\n\nI wasn’t sure you would.");
    }, 800);
  } else if (memory.played) {
    setTimeout(() => {
      showDialogue("…you came back.");
    }, 800);
  }
};
</script>

</body>
</html>
