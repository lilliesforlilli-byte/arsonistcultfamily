<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #020024, #090979, #000);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    h1 { margin-top: 60px; }

    .btn {
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: #00c3ff;
      color: black;
      cursor: pointer;
      box-shadow: 0 0 15px #00c3ff;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px #00c3ff;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .comp-btn {
      width: 150px;
      padding: 10px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    .letter {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      display: none;
    }

    /* GAME OVERLAY */
    #gameOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #0a0f2c, #000);
      display: none;
      overflow: hidden;
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 45%;
      font-size: 45px;
    }

    .bullet {
      position: absolute;
      font-size: 18px;
      color: #00c3ff;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 45%;
      font-size: 55px;
    }

    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .hp-bar {
      width: 80%;
      height: 12px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .hp {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: 0.3s;
    }

    .playerHP { background: #00ff88; }
    .enemyHP { background: #ff3b3b; }

  </style>
</head>

<body>

<h1>🎮 Mission: Jayjay</h1>
<button class="btn" onclick="startMission()">Start Mission</button>

<div id="companions" class="companions hidden">
  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg"><p>Snow ❄️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg"><p>Gaia ☠️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg"><p>Skyfire ⚡</p>
  </div>
</div>

<div id="letter" class="letter"></div>

<!-- GAME -->
<div id="gameOverlay">

  <div class="hud">
    <div class="hp-bar"><div id="pHP" class="hp playerHP"></div></div>
    <div class="hp-bar"><div id="eHP" class="hp enemyHP"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>

</div>

<!-- AUDIO -->
<audio id="bgm" loop src="song1.m4a"></audio>
<audio id="shoot" src="song2.m4a"></audio>

<script>
let playerX = 45;
let enemyX = 45;
let playerHP = 100;
let enemyHP = 100;

function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion(choice) {
  document.getElementById("letter").innerHTML =
    `<p>Companion Selected: ${choice}</p>
     <button class="btn" onclick="startGame()">🚀 Start Battle</button>`;
  document.getElementById("letter").style.display = "block";
}

function startGame() {
  document.getElementById("gameOverlay").style.display = "block";
  document.getElementById("bgm").play();
}

// MOVEMENT
document.addEventListener("keydown", e => {
  if (e.key === "a") playerX -= 3;
  if (e.key === "d") playerX += 3;
  if (e.key === " ") shoot();

  document.getElementById("player").style.left = playerX + "%";
});

// SHOOT
function shoot() {
  let bullet = document.createElement("div");
  bullet.className = "bullet";
  bullet.innerHTML = "⚡";
  bullet.style.left = playerX + "%";
  bullet.style.bottom = "60px";

  document.getElementById("gameOverlay").appendChild(bullet);

  let shootSound = document.getElementById("shoot");
  shootSound.currentTime = 0;
  shootSound.play();

  let pos = 60;

  let move = setInterval(() => {
    pos += 6;
    bullet.style.bottom = pos + "px";

    if (pos > 400 && Math.abs(playerX - enemyX) < 8) {
      enemyHP -= 10;
      updateHP();
      bullet.remove();
      clearInterval(move);
    }

    if (pos > window.innerHeight) {
      bullet.remove();
      clearInterval(move);
    }
  }, 20);
}

// ENEMY AI
setInterval(() => {
  if (document.getElementById("gameOverlay").style.display === "block") {
    enemyX += (Math.random() * 6 - 3);
    document.getElementById("enemy").style.left = enemyX + "%";

    playerHP -= Math.random() * 3;
    updateHP();

    if (enemyHP <= 0) alert("🎉 YOU WIN!");
    if (playerHP <= 0) alert("💀 YOU LOST!");
  }
}, 800);

function updateHP() {
  document.getElementById("pHP").style.width = playerHP + "%";
  document.getElementById("eHP").style.width = enemyHP + "%";
}
</script>

</body>
</html>
