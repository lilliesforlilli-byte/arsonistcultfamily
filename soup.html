<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      cursor: crosshair;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
      margin: 10px;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 160px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.3s;
    }

    .comp-btn:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.1);
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
    }

    #player {
      position: absolute;
      bottom: 40px;
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      font-size: 18px;
      color: #00c3ff;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill {
      height: 100%;
      border-radius: 10px;
    }

    #playerBar { background: #00ff88; width: 100%; }
    #enemyBar { background: red; width: 100%; }

    /* DIALOGUE */
    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
    }

    #choices button {
      display: block;
      margin-top: 10px;
    }

    /* FINAL */
    #finalScene {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0a0f1a, black);
      padding: 20px;
    }

    .finalBox {
      width: 90%;
      max-width: 800px;
      height: 80vh;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(0,195,255,0.15);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #finalText {
      font-size: 20px;
      line-height: 2;
      white-space: pre-line;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<div style="text-align:center">
  <button class="btn" onclick="startMission()">Start Mission</button>
</div>

<!-- COMPANIONS -->
<div id="companions" class="companions hidden">

  <div class="comp-btn" onclick="chooseCompanion()">
    <img src="snowmirage.jpeg">
    <p>Snow Mirage ❄️</p>
  </div>

  <div class="comp-btn" onclick="chooseCompanion()">
    <img src="skyfire.jpeg">
    <p>Skyfire 🔥</p>
  </div>

  <div class="comp-btn" onclick="chooseCompanion()">
    <img src="gaia.jpeg">
    <p>Gaia 🌿</p>
  </div>

</div>

<!-- DIALOGUE -->
<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar" class="fill"></div></div>
    <div class="bar"><div id="enemyBar" class="fill"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<!-- FINAL -->
<div id="finalScene">
  <div class="finalBox">
    <p id="finalText"></p>
    <button class="btn hidden" id="celebrateBtn" onclick="rickroll()">Continue Birthday Celebration 🎉</button>
  </div>
</div>

<audio id="bgm" src="song1.m4a" loop></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let playerHP = 100;
let enemyHP = 100;
let gameActive = false;

let playerX = window.innerWidth / 2;
let enemyX = window.innerWidth / 2;

let keys = {};

/* TYPEWRITER */
function typeText(text, element, callback) {
  let i = 0;
  element.innerHTML = "";

  function type() {
    if (i < text.length) {
      let char = text[i];
      element.innerHTML += char === "\n" ? "<br>" : char;
      i++;
      setTimeout(type, 15);
    } else if (callback) callback();
  }
  type();
}

/* DIALOGUE */
function showDialogue(text, choices=[]) {
  const box = document.getElementById("dialogueBox");
  const textEl = document.getElementById("dialogueText");
  const choiceDiv = document.getElementById("choices");

  box.classList.remove("hidden");
  choiceDiv.innerHTML = "";

  typeText(text, textEl, () => {
    choices.forEach(opt => {
      let btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = opt.text;
      btn.onclick = opt.action;
      choiceDiv.appendChild(btn);
    });
  });
}

function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion() {
  showDialogue("Your companion is ready.", [
    { text: "Start Mission", action: startGame }
  ]);
}

/* GAME START */
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("dialogueBox").classList.add("hidden");
  document.getElementById("bgm").play();

  gameActive = true;
  gameLoop();
  enemyShootLoop();
}

/* INPUT */
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* SHOOT */
document.addEventListener("keydown", e => {
  if (e.key === " " && gameActive) shootBullet();
});

function shootBullet() {
  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";

  b.style.left = playerX + "px";
  b.style.top = (window.innerHeight - 80) + "px";

  document.body.appendChild(b);
  document.getElementById("shootSound").play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 12) + "px";

    if (hitEnemy(b)) {
      enemyHP -= 8;
      updateHP();
      b.remove();
      clearInterval(i);
    }

    if (b.offsetTop < 0) {
      b.remove();
      clearInterval(i);
    }
  }, 16);
}

/* ENEMY SHOOT */
function enemyShootLoop() {
  setInterval(() => {
    if (!gameActive) return;

    let b = document.createElement("div");
    b.className = "bullet";
    b.style.color = "red";
    b.innerHTML = "•";

    b.style.left = enemyX + "px";
    b.style.top = "120px";

    document.body.appendChild(b);

    let i = setInterval(() => {
      b.style.top = (b.offsetTop + 8) + "px";

      if (hitPlayer(b)) {
        playerHP -= 10;
        updateHP();
        b.remove();
        clearInterval(i);
      }

      if (b.offsetTop > window.innerHeight) {
        b.remove();
        clearInterval(i);
      }
    }, 16);
  }, 1200);
}

/* GAME LOOP */
function gameLoop() {
  if (!gameActive) return;

  let player = document.getElementById("player");
  let enemy = document.getElementById("enemy");

  if (keys["ArrowLeft"] || keys["a"]) playerX -= 6;
  if (keys["ArrowRight"] || keys["d"]) playerX += 6;

  playerX = Math.max(20, Math.min(window.innerWidth - 20, playerX));
  player.style.left = playerX + "px";

  enemyX += Math.sin(Date.now() / 500) * 2;
  enemy.style.left = enemyX + "px";

  requestAnimationFrame(gameLoop);
}

/* COLLISIONS */
function hitEnemy(b) {
  let e = document.getElementById("enemy");
  return Math.abs(b.offsetLeft - e.offsetLeft) < 30 &&
         Math.abs(b.offsetTop - e.offsetTop) < 30;
}

function hitPlayer(b) {
  let p = document.getElementById("player");
  return Math.abs(b.offsetLeft - p.offsetLeft) < 30 &&
         Math.abs(b.offsetTop - p.offsetTop) < 30;
}

/* HP */
function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (enemyHP <= 0) {
    gameActive = false;
    setTimeout(showFinal, 800);
  }

  if (playerHP <= 0) {
    gameActive = false;
    alert("You lost 😭");
    location.reload();
  }
}

/* FINAL */
function showFinal() {
  document.getElementById("game").style.display = "none";
  document.getElementById("finalScene").style.display = "flex";

  let msg = `…hey.

Look at you.

You actually did it.

You fought for it.

And that says everything.

You’re strong.
You’re resilient.
You don’t quit.

I admire that about you.

Happy Birthday.

Keep going.
Always.`;

  typeText(msg, document.getElementById("finalText"), () => {
    document.getElementById("celebrateBtn").classList.remove("hidden");
  });
}

function rickroll() {
  window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
}
</script>

</body>
</html>
