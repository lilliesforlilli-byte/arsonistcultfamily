<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #020024, #090979, #000);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 60px;
      font-size: 36px;
    }

    .btn {
      margin-top: 20px;
      padding: 14px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: #00c3ff;
      color: #000;
      box-shadow: 0 0 15px #00c3ff;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px #00c3ff;
    }

    .hidden {
      display: none;
    }

    .companions {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .comp-btn {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 15px;
      width: 150px;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(6px);
    }

    .comp-btn img {
      width: 100%;
      border-radius: 12px;
    }

    .snow:hover { box-shadow: 0 0 20px #4cc9f0; transform: translateY(-6px); }
    .gaia:hover { box-shadow: 0 0 20px #ff006e; transform: translateY(-6px); }
    .skyfire:hover { box-shadow: 0 0 20px #ffd60a; transform: translateY(-6px); }

    .letter {
      max-width: 600px;
      margin: 50px auto;
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      display: none;
      text-align: left;
      line-height: 1.7;
    }

    .music {
      margin-top: 30px;
    }

    audio {
      width: 80%;
      margin-top: 10px;
    }

    /* SNOW EFFECT */
    .snow-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(2px 2px at 40px 70px, white, transparent),
        radial-gradient(1.5px 1.5px at 90px 40px, white, transparent);
      background-size: 200px 200px;
      animation: snow 12s linear infinite;
      opacity: 0.5;
    }

    @keyframes snow {
      0% { background-position: 0 -200px; }
      100% { background-position: 0 100vh; }
    }

    /* GAME ARENA */
    #game {
      margin-top: 50px;
    }

    .arena {
      position: relative;
      width: 90%;
      height: 300px;
      margin: 30px auto;
      border-radius: 20px;
      background: radial-gradient(circle, #0a0f2c, #000);
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.2);
    }

    #player, #enemy {
      position: absolute;
      bottom: 20px;
      font-size: 40px;
      transition: 0.2s;
    }

    #player {
      left: 50%;
    }

    #enemy {
      right: 10%;
    }

    .controls {
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
    }

  </style>
</head>

<body>

<div class="snow-bg"></div>

<h1>🎮 Mission: Jayjay's Birthday</h1>

<button class="btn" onclick="startMission()">Start Mission</button>

<div id="companions" class="companions hidden">

  <div class="comp-btn snow" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg">
    <p>Snow Mirage ❄️</p>
  </div>

  <div class="comp-btn gaia" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg">
    <p>Gaia ☠️</p>
  </div>

  <div class="comp-btn skyfire" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg">
    <p>Skyfire ⚡</p>
  </div>

</div>

<div id="letter" class="letter"></div>

<div id="music" class="music hidden">
  <h3>Mission Soundtracks</h3>
  <button class="btn" onclick="playMusic('song1.m4a')">Track 1</button>
  <button class="btn" onclick="playMusic('song2.m4a')">Track 2</button>
  <br>
  <audio id="playerAudio" controls></audio>
</div>

<!-- GAME -->
<div id="game" class="hidden">
  <h2>⚔️ Mecha Battle Initiated</h2>

  <div class="arena">
    <div id="player">🤖</div>
    <div id="enemy">👾</div>
  </div>

  <div class="controls">
    <button class="btn" onclick="move('left')">⬅️</button>
    <button class="btn" onclick="attack()">⚡ Attack</button>
    <button class="btn" onclick="move('right')">➡️</button>
  </div>

  <p id="status">Enemy HP: 100</p>
</div>

<script>
  let playerPos = 50;
  let enemyHP = 100;

  function startMission() {
    document.getElementById("companions").classList.remove("hidden");
  }

  function chooseCompanion(choice) {
    const letter = document.getElementById("letter");

    if (choice === "snow") {
      letter.innerHTML = `
        <p><strong>Mission Log: Snow Mirage ❄️</strong></p>
        <p>You chose the calmest and strongest one… just like you.</p>
        <p>You’ve always been someone who stays, who protects, who cares quietly but deeply.</p>
        <p>Happy Birthday, weirdo 💙</p>
      `;
    }

    if (choice === "gaia") {
      letter.innerHTML = `
        <p><strong>Mission Log: Gaia ☠️</strong></p>
        <p>Bold choice. Chaotic energy. Very you.</p>
        <p>You bring chaos in the best way.</p>
      `;
    }

    if (choice === "skyfire") {
      letter.innerHTML = `
        <p><strong>Mission Log: Skyfire ⚡</strong></p>
        <p>Fast, sharp, unstoppable.</p>
        <p>You face everything head-on.</p>
      `;
    }

    letter.innerHTML += `
      <br><br>
      <button class="btn" onclick="launchGame()">🚀 Start Battle</button>
    `;

    letter.style.display = "block";
    document.getElementById("music").classList.remove("hidden");
  }

  function launchGame() {
    document.getElementById("game").classList.remove("hidden");
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function move(direction) {
    const player = document.getElementById("player");

    if (direction === "left") playerPos -= 10;
    if (direction === "right") playerPos += 10;

    player.style.left = playerPos + "%";
  }

  function attack() {
    const status = document.getElementById("status");

    let damage = Math.floor(Math.random() * 20) + 5;
    enemyHP -= damage;

    if (enemyHP <= 0) {
      enemyHP = 0;
      status.innerHTML = "🎉 Enemy Destroyed! Mission Complete.";
    } else {
      status.innerHTML = "Enemy HP: " + enemyHP + " (-" + damage + ")";
    }
  }

  function playMusic(file) {
    const player = document.getElementById("playerAudio");
    player.src = file;
    player.play();
  }
</script>

</body>
</html>
