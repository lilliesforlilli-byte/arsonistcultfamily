<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      cursor: crosshair;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
      margin: 10px;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 160px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.3s;
    }

    .comp-btn:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.1);
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      color: #00c3ff;
      font-size: 18px;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill {
      height: 100%;
      border-radius: 10px;
    }

    #playerBar { background: #00ff88; width: 100%; }
    #enemyBar { background: red; width: 100%; }

    /* DIALOGUE */
    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
    }

    #choices button {
      display: block;
      margin-top: 10px;
    }

    /* FINAL SCENE */
    #finalScene {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0a0f1a, black);
      padding: 20px;
    }

    .finalBox {
      width: 90%;
      max-width: 800px;
      height: 80vh;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(0,195,255,0.15);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #finalText {
      font-size: 20px;
      line-height: 2;
      white-space: pre-line;
      overflow-y: auto;
      padding-right: 10px;
    }
  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<div style="text-align:center">
  <button class="btn" onclick="startMission()">Start Mission</button>
</div>

<!-- COMPANIONS -->
<div id="companions" class="companions hidden">

  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg">
    <p>Snow Mirage ❄️</p>
  </div>

  <div class="comp-btn" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg">
    <p>Skyfire 🔥</p>
  </div>

  <div class="comp-btn" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg">
    <p>Gaia 🌿</p>
  </div>

</div>

<!-- DIALOGUE -->
<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar" class="fill"></div></div>
    <div class="bar"><div id="enemyBar" class="fill"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<!-- FINAL -->
<div id="finalScene">
  <div class="finalBox">
    <p id="finalText"></p>
    <button class="btn hidden" id="restartBtn" onclick="location.reload()">Restart</button>
  </div>
</div>

<audio id="bgm" src="song1.m4a" loop></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let playerHP = 100;
let enemyHP = 100;
let gameActive = false;
let typingTimeout;

/* TYPEWRITER */
function typeText(text, element, callback) {
  let i = 0;
  element.innerHTML = "";
  clearTimeout(typingTimeout);

  function type() {
    if (i < text.length) {
      let char = text[i];

      if (char === "\n") {
        element.innerHTML += "<br>";
      } else {
        element.innerHTML += char;
      }

      let delay = (char === "." || char === "…") ? 200 : 18;
      i++;
      typingTimeout = setTimeout(type, delay);
    } else if (callback) {
      callback();
    }
  }

  type();
}

/* DIALOGUE */
function showDialogue(text, choices=[]) {
  const box = document.getElementById("dialogueBox");
  const textEl = document.getElementById("dialogueText");
  const choiceDiv = document.getElementById("choices");

  box.classList.remove("hidden");
  choiceDiv.innerHTML = "";

  typeText(text, textEl, () => {
    choices.forEach(opt => {
      let btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = opt.text;
      btn.onclick = opt.action;
      choiceDiv.appendChild(btn);
    });
  });
}

/* FLOW */
function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

/* COMPANIONS */
function chooseCompanion(name) {
  let text = "";

  if (name === "snow") {
    text = "…Snow Mirage online.\n\nSilent. Cold. Watching.\n\nYou chose me.";
  } 
  else if (name === "skyfire") {
    text = "…Skyfire ignited.\n\nWe burn through anything in our way.\n\nLet’s move.";
  } 
  else if (name === "gaia") {
    text = "…Gaia awakened.\n\nThe earth stands with you.\n\nYou are not alone.";
  }

  showDialogue(text, [
    { text: "Start Mission", action: startGame }
  ]);
}

/* GAME */
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("dialogueBox").classList.add("hidden");
  document.getElementById("bgm").play();

  gameActive = true;
}

/* SHOOT */
document.addEventListener("click", e => {
  if (!gameActive) return;

  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";
  b.style.left = e.clientX + "px";
  b.style.top = (window.innerHeight - 60) + "px";

  document.body.appendChild(b);

  let sound = document.getElementById("shootSound");
  sound.currentTime = 0;
  sound.play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 10) + "px";

    if (b.offsetTop < 120) {
      enemyHP -= 10;
      updateHP();
      b.remove();
      clearInterval(i);
    }

    if (b.offsetTop < 0) {
      b.remove();
      clearInterval(i);
    }
  }, 16);
});

/* ENEMY DAMAGE */
setInterval(() => {
  if (!gameActive) return;

  playerHP -= 2;
  updateHP();
}, 1000);

/* HP */
function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (enemyHP <= 0) {
    gameActive = false;
    setTimeout(showFinal, 800);
  }
}

/* FINAL */
function showFinal() {
  document.getElementById("game").style.display = "none";
  document.getElementById("finalScene").style.display = "flex";

  let msg = `…hey.

Look at you.

You actually did it.

You kept going,
you stayed focused,
and you didn’t give up when it got difficult.

That says everything about who you are.

You’re strong —
not just in moments like this,
but in the way you keep showing up every single day.

You’re resilient —
you don’t quit, even when things don’t go your way.

You’re kind —
in a way that people don’t always notice,
but it matters more than you think.

And most importantly…

you’re determined.

You keep trying to grow,
to improve,
to become better than you were before.

That kind of mindset?

It’s powerful.

It’s rare.

And it’s something to be proud of.

I admire that about you.

Genuinely.

So yeah…

take a moment and recognize this version of yourself.

Because this?

This is someone strong.

Someone capable.

Someone who’s going to go really far.

Happy Birthday.

Keep going.

I’ll always be rooting for you.`;

  typeText(msg, document.getElementById("finalText"), () => {
    document.getElementById("restartBtn").classList.remove("hidden");
  });
}
</script>

</body>
</html>
