<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }

    h1 {
      text-align: center;
      margin-top: 40px;
    }

    .btn {
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: #00c3ff;
      color: black;
      cursor: pointer;
      box-shadow: 0 0 15px #00c3ff;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 140px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      cursor: pointer;
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    .letter {
      text-align: center;
      margin-top: 20px;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background:
        radial-gradient(circle at center, #0a0f2c, #000),
        repeating-linear-gradient(0deg, rgba(0,255,255,0.1) 0px, transparent 2px, transparent 40px),
        repeating-linear-gradient(90deg, rgba(0,255,255,0.1) 0px, transparent 2px, transparent 40px);
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      font-size: 14px;
    }

    .enemyBullet {
      color: red;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
    }

    #playerBar { background: #00ff88; }
    #enemyBar { background: #ff3b3b; }

  </style>
</head>

<body>

<h1>🎮 Mission: Jayjay</h1>
<div style="text-align:center">
<button class="btn" onclick="startMission()">Start Mission</button>
</div>

<div id="companions" class="companions hidden">
  <div class="comp-btn" onclick="chooseCompanion()">
    <img src="snowmirage.jpeg"><p>Snow ❄️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion()">
    <img src="gaia.jpeg"><p>Gaia ☠️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion()">
    <img src="skyfire.jpeg"><p>Skyfire ⚡</p>
  </div>
</div>

<div id="letter" class="letter"></div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar" class="fill"></div></div>
    <div class="bar"><div id="enemyBar" class="fill"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<audio id="bgm" loop src="song1.m4a"></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let playerHP = 100;
let enemyHP = 100;

function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion() {
  document.getElementById("letter").innerHTML =
    `<button class="btn" onclick="startGame()">🚀 Start Battle</button>`;
}

function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("bgm").play();
}

// PLAYER SHOOT (CLICK)
document.addEventListener("click", shoot);

function shoot(e) {
  if (!document.getElementById("game").style.display) return;

  let bullet = document.createElement("div");
  bullet.className = "bullet";
  bullet.innerHTML = "•";
  bullet.style.left = e.clientX + "px";
  bullet.style.top = (window.innerHeight - 80) + "px";

  document.body.appendChild(bullet);

  let shootSound = document.getElementById("shootSound");
  shootSound.currentTime = 0;
  shootSound.play();

  let interval = setInterval(() => {
    bullet.style.top = (bullet.offsetTop - 8) + "px";

    if (Math.abs(bullet.offsetLeft - window.innerWidth/2) < 50 &&
        bullet.offsetTop < 120) {
      enemyHP -= 5;
      updateHP();
      bullet.remove();
      clearInterval(interval);
    }

    if (bullet.offsetTop < 0) {
      bullet.remove();
      clearInterval(interval);
    }

  }, 16);
}

// ENEMY SHOOT
setInterval(() => {
  if (!document.getElementById("game").style.display) return;

  let b = document.createElement("div");
  b.className = "bullet enemyBullet";
  b.innerHTML = "•";
  b.style.left = (window.innerWidth/2) + "px";
  b.style.top = "100px";

  document.body.appendChild(b);

  let i = setInterval(() => {
    b.style.top = (b.offsetTop + 6) + "px";

    if (Math.abs(b.offsetLeft - window.innerWidth/2) < 50 &&
        b.offsetTop > window.innerHeight - 120) {
      playerHP -= 5;
      updateHP();
      b.remove();
      clearInterval(i);
    }

    if (b.offsetTop > window.innerHeight) {
      b.remove();
      clearInterval(i);
    }

  }, 16);

}, 1200);

function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (enemyHP <= 0) alert("🎉 YOU WIN!");
  if (playerHP <= 0) alert("💀 YOU LOST!");
}
</script>

</body>
</html>
