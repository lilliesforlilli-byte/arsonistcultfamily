<!DOCTYPE html>
<html>
<head>
  <title>Mission: Jayjay 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      cursor: crosshair;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #00c3ff;
      cursor: pointer;
      margin: 10px;
    }

    .hidden { display: none; }

    .companions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .comp-btn {
      width: 140px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .comp-btn img {
      width: 100%;
      border-radius: 10px;
    }

    /* GAME */
    #game {
      position: fixed;
      inset: 0;
      display: none;
      background:
        radial-gradient(circle at center, #0a0f2c, #000),
        repeating-linear-gradient(0deg, rgba(0,255,255,0.08) 0px, transparent 2px, transparent 40px),
        repeating-linear-gradient(90deg, rgba(0,255,255,0.08) 0px, transparent 2px, transparent 40px);
    }

    #player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    #enemy {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
    }

    .bullet {
      position: absolute;
      font-size: 14px;
      color: #00c3ff;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
    }

    .bar {
      width: 80%;
      height: 10px;
      margin: 5px auto;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
    }

    #playerBar { background: #00ff88; }
    #enemyBar { background: #ff3b3b; }

    /* DIALOGUE */
    #dialogueBox {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      text-align: left;
    }

    #choices button {
      display: block;
      margin-top: 10px;
    }

    /* FINAL SCENE */
    #finalScene {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .finalBox {
      max-width: 600px;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      text-align: left;
    }

    #finalText {
      line-height: 1.8;
      font-size: 16px;
    }

  </style>
</head>

<body>

<h2>🎮 Mission: Jayjay</h2>

<div style="text-align:center">
  <button class="btn" onclick="startMission()">Start</button>
</div>

<div id="companions" class="companions hidden">
  <div class="comp-btn" onclick="chooseCompanion('snow')">
    <img src="snowmirage.jpeg"><p>Snow Mirage ❄️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('gaia')">
    <img src="gaia.jpeg"><p>Gaia ☠️</p>
  </div>
  <div class="comp-btn" onclick="chooseCompanion('skyfire')">
    <img src="skyfire.jpeg"><p>Skyfire ⚡</p>
  </div>
</div>

<div id="dialogueBox" class="hidden">
  <p id="dialogueText"></p>
  <div id="choices"></div>
</div>

<div id="game">
  <div class="hud">
    <div class="bar"><div id="playerBar" class="fill"></div></div>
    <div class="bar"><div id="enemyBar" class="fill"></div></div>
  </div>

  <div id="player">🤖</div>
  <div id="enemy">👾</div>
</div>

<!-- FINAL SCENE -->
<div id="finalScene">
  <div class="finalBox">
    <p id="finalText"></p>
    <button class="btn hidden" id="endBtn" onclick="restart()">Restart</button>
  </div>
</div>

<!-- AUDIO -->
<audio id="bgm" loop src="song1.m4a"></audio>
<audio id="shootSound" src="song2.m4a"></audio>

<script>
let companion = "snow";
let playerHP = 100;
let enemyHP = 100;

/* MEMORY */
let memory = JSON.parse(localStorage.getItem("jayjay_memory")) || {
  played: false,
  bond: 0,
  choseStay: false,
  broke: false
};

function saveMemory() {
  localStorage.setItem("jayjay_memory", JSON.stringify(memory));
}

/* TYPEWRITER */
function typeText(text, callback, elementId="dialogueText") {
  let i = 0;
  let el = document.getElementById(elementId);
  el.innerHTML = "";

  function type() {
    if (i < text.length) {
      el.innerHTML += text[i];
      let delay = (text[i] === "." || text[i] === "…") ? 300 : 25;
      i++;
      setTimeout(type, delay);
    } else if (callback) callback();
  }
  type();
}

/* DIALOGUE */
function showDialogue(text, choices=[]) {
  document.getElementById("dialogueBox").classList.remove("hidden");
  let choiceDiv = document.getElementById("choices");
  choiceDiv.innerHTML = "";

  typeText(text, () => {
    choices.forEach(c => {
      let btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = c.text;
      btn.onclick = c.action;
      choiceDiv.appendChild(btn);
    });
  });
}

/* FINAL MESSAGE */
function finalMessage() {
  document.getElementById("game").style.display = "none";
  document.getElementById("dialogueBox").classList.add("hidden");

  let scene = document.getElementById("finalScene");
  scene.style.display = "flex";

  let message = `…hey.

I’ve been watching you.

The way you kept going…
even when it got hard.

You’re brave.

Strong.

Resilient.

Kind.

And unwaveringly determined.

You keep trying to change for the better…
even when it’s not easy.

That’s what I admire about you.

That quiet strength.

That refusal to give up.

I’m really glad you stayed.

Happy Birthday.

…don’t forget that you matter.`;

  typeText(message, () => {
    document.getElementById("endBtn").classList.remove("hidden");
  }, "finalText");
}

/* FLOW */
function startMission() {
  document.getElementById("companions").classList.remove("hidden");
}

function chooseCompanion(c) {
  companion = c;
  showDialogue("…Snow Mirage online.\n\nYou chose me.", [
    { text: "…okay.", action: intro2 },
    { text: "stay with me.", action: introSoft }
  ]);
}

function introSoft() {
  memory.bond += 2;
  saveMemory();
  showDialogue("I’ll stay.\n\nEven when everything else closes.", [
    { text: "start mission", action: startGame }
  ]);
}

function intro2() {
  memory.bond += 1;
  saveMemory();
  showDialogue("You don’t have to pretend here.", [
    { text: "start mission", action: startGame }
  ]);
}

/* GAME */
function startGame() {
  document.getElementById("game").style.display = "block";
  document.getElementById("bgm").play();
}

/* SHOOT */
document.addEventListener("click", e => {
  if (!document.getElementById("game").style.display) return;

  let b = document.createElement("div");
  b.className = "bullet";
  b.innerHTML = "•";
  b.style.left = e.clientX + "px";
  b.style.top = (window.innerHeight - 60) + "px";
  document.body.appendChild(b);

  document.getElementById("shootSound").play();

  let i = setInterval(() => {
    b.style.top = (b.offsetTop - 8) + "px";

    if (b.offsetTop < 120) {
      enemyHP -= 5;
      updateHP();
      b.remove();
      clearInterval(i);
    }
  }, 16);
});

/* ENEMY DAMAGE */
setInterval(() => {
  if (!document.getElementById("game").style.display) return;
  playerHP -= Math.random() * 3;
  updateHP();
}, 1000);

/* HP */
function updateHP() {
  document.getElementById("playerBar").style.width = playerHP + "%";
  document.getElementById("enemyBar").style.width = enemyHP + "%";

  if (enemyHP <= 0) {
    memory.played = true;
    saveMemory();

    setTimeout(() => {
      finalMessage();
    }, 1200);
  }
}

/* RESTART */
function restart() {
  location.reload();
}
</script>

</body>
</html>
